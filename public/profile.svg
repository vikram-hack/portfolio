<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2e25"/>
      <stop offset="100%" stop-color="#080D0B"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00FF9C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00FF9C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#glow)"/>
  
  <!-- Grid pattern -->
  <g stroke="#00FF9C" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="280" x2="400" y2="280"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="0" y1="360" x2="400" y2="360"/>
    <line x1="40" y1="0" x2="40" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="280" y1="0" x2="280" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
  </g>

  <!-- Person silhouette -->
  <!-- Head -->
  <circle cx="200" cy="145" r="65" fill="#26352E"/>
  <circle cx="200" cy="145" r="63" fill="#1a2e25"/>
  
  <!-- Body/shoulders -->
  <path d="M60 400 C60 320 120 280 200 260 C280 280 340 320 340 400Z" fill="#26352E"/>
  <path d="M65 400 C65 325 122 283 200 263 C278 283 335 325 335 400Z" fill="#1a2e25"/>
  
  <!-- Face details -->
  <!-- Eyes -->
  <ellipse cx="180" cy="140" rx="8" ry="9" fill="#080D0B"/>
  <ellipse cx="220" cy="140" rx="8" ry="9" fill="#080D0B"/>
  <circle cx="182" cy="138" r="3" fill="#00FF9C" opacity="0.6"/>
  <circle cx="222" cy="138" r="3" fill="#00FF9C" opacity="0.6"/>
  
  <!-- Mouth -->
  <path d="M183 165 Q200 175 217 165" stroke="#00FF9C" stroke-opacity="0.5" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Neon ring around head -->
  <circle cx="200" cy="145" r="68" stroke="#00FF9C" stroke-opacity="0.2" stroke-width="1.5" fill="none"/>
  
  <!-- Initials -->
  <text x="200" y="390" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#00FF9C" opacity="0.6">VIKRAM M.</text>
</svg>

